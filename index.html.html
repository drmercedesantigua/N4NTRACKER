// Compress image before upload
const compressImage=(file,maxWidth=900,quality=0.75)=>new Promise((resolve,reject)=>{
  if(!file||!file.type.startsWith('image/')){reject(new Error('Not an image'));return;}
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error('Failed to read file'));
  reader.onload=e=>{
    const img=new Image();
    img.onerror=()=>reject(new Error('Failed to load image'));
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxWidth){h=Math.round(h*(maxWidth/w));w=maxWidth;}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>{
        if(!blob)reject(new Error('Compression failed'));
        else resolve(blob);
      },'image/jpeg',quality);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
});

function LoginScreen({onLogin}){
  const [email,setEmail]=useState('');
  const [password,setPassword]=useState('');
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');
  const [mode,setMode]=useState('login'); // login | signup (signup only if allowed)

  const submit=async(e)=>{
    e.preventDefault();
    setError(''); setLoading(true);
    try{
      if(mode==='login'){
        const {data,error}=await supabase.auth.signInWithPassword({email,password});
        if(error)throw error;
        onLogin(data.session);
      }else{
        const {data,error}=await supabase.auth.signUp({email,password});
        if(error)throw error;
        if(data.session)onLogin(data.session);
        else setError('Check your email to confirm the account, or ask an admin to create your user.');
      }
    }catch(err){
      setError(err.message||'Authentication error');
    }finally{setLoading(false);}
  };

  const configOk = SUPABASE_URL && !SUPABASE_URL.includes('PEGAR_AQUI') && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('PEGAR_AQUI');

  return (
    <div className="min-h-screen login-bg flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
        <div className="text-center mb-8">
          <div className="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto mb-4"><i className="fa-solid fa-layer-group"></i></div>
          <h1 className="text-2xl font-extrabold text-slate-900">N4N Tracker</h1>
          <p className="text-slate-500 text-sm mt-1">Case Management & Housing Intelligence</p>
        </div>
        {!configOk && (
          <div className="mb-6 p-4 bg-amber-50 border border-amber-200 rounded-xl text-sm text-amber-900">
            <b>Setup required:</b> Open this file and replace <code className="bg-amber-100 px-1 rounded">SUPABASE_URL</code> y <code className="bg-amber-100 px-1 rounded">SUPABASE_ANON_KEY</code> with your Supabase project values (Project Settings → API).
          </div>
        )}
        <form onSubmit={submit} className="space-y-4">
          <div>
            <label className="text-xs font-bold uppercase text-slate-500">Email</label>
            <input type="email" required value={email} onChange={e=>setEmail(e.target.value)} className="mt-1 w-full border rounded-lg px-3 py-2.5" placeholder="tu@email.com"/>
          </div>
          <div>
            <label className="text-xs font-bold uppercase text-slate-500">Password</label>
            <input type="password" required value={password} onChange={e=>setPassword(e.target.value)} className="mt-1 w-full border rounded-lg px-3 py-2.5" placeholder="••••••••"/>
          </div>
          {error && <div className="text-sm text-rose-600 bg-rose-50 p-3 rounded-lg">{error}</div>}
          <button type="submit" disabled={loading||!configOk} className="w-full py-3 bg-blue-700 text-white rounded-xl font-bold hover:bg-blue-800 disabled:opacity-50">
            {loading?<i className="fa-solid fa-spinner fa-spin"></i>:(mode==='login'?'Sign in':'Create account')}
          </button>
        </form>
        <p className="text-center text-xs text-slate-400 mt-6">Protected data · Authorized staff only</p>
      </div>
    </div>
  );
}

  // Auth bootstrap
  useEffect(()=>{
    supabase.auth.getSession().then(({data:{session}})=>{
      setSession(session);
      setAuthLoading(false);
    });
    const {data:{subscription}}=supabase.auth.onAuthStateChange((_event,session)=>{
      setSession(session);
    });
    return ()=>subscription.unsubscribe();
  },[]);

  // Load data + realtime
  const loadData=useCallback(async()=>{
    if(!session)return;
    setDataLoading(true);
    try{
      const [hRes,dRes]=await Promise.all([
        supabase.from('households').select('*').order('unit'),
        supabase.from('discharges').select('*').order('discharged_at',{ascending:false})
      ]);
      if(hRes.error)throw hRes.error;
      if(dRes.error)throw dRes.error;
      const mapped=(hRes.data||[]).map(fromDB);
      setFamilies(mapped);
      setDischarges((dRes.data||[]).map(fromDB));
      setSeedNeeded(mapped.length===0);
      if(mapped.length&&!selectedId)setSelectedId(mapped[0].caresId);
    }catch(err){
      console.error(err);
      showToast('Error loading data: '+err.message,'err');
    }finally{setDataLoading(false);}
  },[session]);

  useEffect(()=>{if(session)loadData();},[session,loadData]);

  // Realtime subscriptions
  useEffect(()=>{
    if(!session)return;
    const ch1=supabase.channel('households-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'households'},payload=>{
        if(payload.eventType==='INSERT'){
          const row=fromDB(payload.new);
          setFamilies(fs=>{
            if(fs.some(f=>f.caresId===row.caresId))return fs;
            return [...fs,row].sort((a,b)=>(a.unit||'').localeCompare(b.unit||''));
          });
        }else if(payload.eventType==='UPDATE'){
          const row=fromDB(payload.new);
          setFamilies(fs=>fs.map(f=>f.caresId===row.caresId?row:f));
        }else if(payload.eventType==='DELETE'){
          setFamilies(fs=>fs.filter(f=>f.caresId!==payload.old.cares_id));
        }
      }).subscribe();
    const ch2=supabase.channel('discharges-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'discharges'},payload=>{
        if(payload.eventType==='INSERT'){
          const row=fromDB(payload.new);
          setDischarges(ds=>[row,...ds.filter(d=>d.dischargedAt!==row.dischargedAt)]);
        }else if(payload.eventType==='DELETE'){
          setDischarges(ds=>ds.filter(d=>d.dischargedAt!==payload.old.discharged_at));
        }
      }).subscribe();
    return ()=>{supabase.removeChannel(ch1);supabase.removeChannel(ch2);};
  },[session]);

  // Seed initial data once
  const seedData=async()=>{
    if(!confirm('Load all original Master Tracker data into the database? Do this only once.'))return;
    setSaving(true);
    try{
      const rows=SOURCE_FAMILIES.map(f=>({...toDB(f),members:f.members||[]}));
      // Upsert in batches of 20
      for(let i=0;i<rows.length;i+=20){
        const batch=rows.slice(i,i+20);
        const {error}=await supabase.from('households').upsert(batch,{onConflict:'cares_id'});
        if(error)throw error;
      }
      showToast('Initial data loaded successfully');
      await loadData();
    }catch(err){
      showToast('Error loading seed data: '+err.message,'err');
    }finally{setSaving(false);}
  };

  const enriched=useMemo(()=>families.map(f=>{let c=compliance(f);return{...f,...c,householdSize:(Number(f.adults)||0)+(Number(f.children)||0),voucherDays:voucherDays(f),nextMeetingCalc:addDays(f.lastILP,15),floor:parseFloor(f.unit)}}).sort((a,b)=>unitSortKey(a.unit)-unitSortKey(b.unit)),[families]);
  const selected=enriched.find(f=>f.caresId===selectedId)||enriched[0];
  const totalIndividuals=enriched.reduce((a,f)=>a+f.householdSize,0);
  const activeVouchers=enriched.filter(f=>f.voucherStatus==='Active').length;
  const avgIncome=(()=>{let x=enriched.filter(f=>Number(f.monthlyIncome)>0);return x.length?x.reduce((a,f)=>a+Number(f.monthlyIncome),0)/x.length:0})();
  const compliant=enriched.filter(f=>f.overall==='100% Compliant').length;
  const actionNeeded=enriched.filter(f=>f.action).length;
  const cmNames=[...new Set(enriched.map(f=>f.caseManager).filter(Boolean))];
  const floorOptions=useMemo(()=>{const s=new Set(enriched.map(f=>f.floor).filter(x=>x!=null));return [...s].sort((a,b)=>a-b);},[enriched]);
  const filtered=enriched.filter(f=>{let q=query.toLowerCase(); return (!q||[f.unit,f.hohName,f.caresId,f.caseManager,f.housingStatus,f.voucherType].some(v=>(v||'').toString().toLowerCase().includes(q)))&&(cmFilter==='All'||f.caseManager===cmFilter)&&(floorFilter==='All'||f.floor===Number(floorFilter));});
  const cmStats=cmNames.map(name=>{let a=enriched.filter(f=>f.caseManager===name),full=a.filter(f=>f.overall==='100% Compliant').length,partial=a.filter(f=>f.overall==='Partially Compliant').length,non=a.filter(f=>f.overall==='Non-Compliant').length;return{name,total:a.length,full,partial,non,rate:a.length?(full/a.length*100):0}});

  // Save profile (update or insert)
  const save=async()=>{
    if(!edit)return;
    setSaving(true);
    try{
      let photoUrl=edit.photo;
      // If photo is a File/Blob (new upload), upload to Storage
      if(edit._photoFile){
        const path=`${edit.caresId}/${Date.now()}.jpg`;
        const {error:upErr}=await supabase.storage.from('family-photos').upload(path,edit._photoFile,{upsert:true,contentType:'image/jpeg'});
        if(upErr)throw upErr;
        const {data:urlData}=supabase.storage.from('family-photos').getPublicUrl(path);
        photoUrl=urlData.publicUrl;
      }
      const payload={...toDB({...edit,photo:photoUrl}),updated_by:session.user.id};
      const {error}=await supabase.from('households').upsert(payload,{onConflict:'cares_id'});
      if(error)throw error;
      // Optimistic local update
      setFamilies(fs=>{
        const exists=fs.some(f=>f.caresId===edit.caresId);
        const updated={...edit,photo:photoUrl};
        delete updated._photoFile;
        if(exists)return fs.map(f=>f.caresId===edit.caresId?updated:f);
        return [...fs,updated];
      });
      setSelectedId(edit.caresId);
      setEdit(null);
      showToast('Profile saved');
    }catch(err){
      showToast('Error saving: '+err.message,'err');
    }finally{setSaving(false);}
  };

  const completeDischarge=async()=>{
    if(!dischargeEdit?.dischargeDate||!dischargeEdit?.dischargeReason){alert('Discharge Date and Discharge Reason are required.');return;}
    setSaving(true);
    try{
      const original=families.find(f=>f.caresId===dischargeEdit.caresId);
      if(!original)throw new Error('Household not found');
      // Only columns that exist on the discharges table (no next_meeting / action_needed / updated_*)
      const base=toDB(original);
      const archived={
        cares_id: base.cares_id,
        unit: base.unit,
        hoh_name: base.hoh_name,
        phone: base.phone,
        language: base.language,
        intake_date: base.intake_date,
        age: base.age,
        gender: base.gender,
        adults: base.adults,
        children: base.children,
        asylum_arrival: base.asylum_arrival,
        ead_status: base.ead_status,
        housing_status: base.housing_status,
        voucher_type: base.voucher_type,
        voucher_amount: base.voucher_amount,
        client_portion: base.client_portion,
        voucher_exp_date: base.voucher_exp_date,
        bedroom_size: base.bedroom_size,
        voucher_status: base.voucher_status,
        public_assistance: base.public_assistance,
        ama_program: base.ama_program,
        ama_status: base.ama_status,
        employment_status: base.employment_status,
        job_training: base.job_training,
        monthly_income: base.monthly_income,
        income_source: base.income_source,
        case_notes: base.case_notes,
        case_manager: base.case_manager,
        last_ilp: base.last_ilp,
        last_inspection: base.last_inspection,
        photo_url: base.photo_url,
        members: base.members||[],
        discharge_date: dischargeEdit.dischargeDate,
        discharge_reason: dischargeEdit.dischargeReason,
        discharge_destination: dischargeEdit.dischargeDestination||null,
        discharge_staff: dischargeEdit.dischargeStaff||original.caseManager||null,
        discharge_notes: dischargeEdit.dischargeNotes||null,
        discharged_by: session.user.id
      };
      const {error:insErr}=await supabase.from('discharges').insert(archived);
      if(insErr)throw insErr;
      const {error:delErr}=await supabase.from('households').delete().eq('cares_id',original.caresId);
      if(delErr)throw delErr;
      setFamilies(fs=>fs.filter(f=>f.caresId!==original.caresId));
      setSelectedId(null);
      setDischargeEdit(null);
      setView('discharge');
      showToast('Discharge completed and archived');
    }catch(err){
      console.error(err);
      showToast('Discharge error: '+err.message,'err');
    }finally{setSaving(false);}
  };

  const restoreDischarge=async(record)=>{
    if(!confirm('Restore this household to Active Family Profiles? The discharge record will be removed from the archive.'))return;
    setSaving(true);
    try{
      const payload=toDB(record);
      // Strip discharge-only fields that don't belong on households
      delete payload.discharge_date;
      delete payload.discharge_reason;
      delete payload.discharge_destination;
      delete payload.discharge_staff;
      delete payload.discharge_notes;
      delete payload.discharged_at;
      delete payload.discharged_by;
      const {error:insErr}=await supabase.from('households').upsert(payload,{onConflict:'cares_id'});
      if(insErr)throw insErr;
      if(record.dischargedAt){
        await supabase.from('discharges').delete().eq('discharged_at',record.dischargedAt);
      }else if(record.caresId){
        await supabase.from('discharges').delete().eq('cares_id',record.caresId);
      }
      await loadData();
      setSelectedId(record.caresId);
      setView('households');
      showToast('Household restored');
    }catch(err){
      console.error(err);
      showToast('Restore error: '+err.message,'err');
    }finally{setSaving(false);}
  };

  const logout=async()=>{await supabase.auth.signOut();setSession(null);setFamilies([]);setDischarges([]);};

  const exportCSV=()=>{
    let cols=['unit','hohName','caresId','phone','language','intakeDate','adults','children','caseManager','housingStatus','voucherType','voucherAmount','clientPortion','voucherExpDate','voucherStatus','publicAssistance','amaProgram','amaStatus','employmentStatus','jobTraining','monthlyIncome','incomeSource','lastILP','lastInspection','caseNotes'];
    let esc=v=>'"'+String(v??'').replaceAll('"','""')+'"';
    let csv=[cols.join(','),...enriched.map(f=>cols.map(c=>esc(f[c])).join(','))].join('\\n');
    let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='N4N_Master_Tracker_Export.csv';a.click();
  };

  if(authLoading)return <div className="min-h-screen flex items-center justify-center bg-slate-100"><i className="fa-solid fa-spinner fa-spin text-3xl text-blue-600"></i></div>;
  if(!session)return <LoginScreen onLogin={setSession}/>;

  const nav=[['dashboard','fa-solid fa-chart-line','Executive Dashboard'],['households','fa-solid fa-people-roof','Family Profiles'],['housing','fa-solid fa-house-circle-check','Housing & Vouchers'],['case','fa-solid fa-clipboard-check','Case Management'],['discharge','fa-solid fa-box-archive','Discharge Archive'],['roster','fa-solid fa-users','Resident Roster'],['reports','fa-solid fa-file-lines','Reports & Analytics'],['protocol','fa-solid fa-shield-halved','Protocol Standards']];

  return <div className="flex h-screen overflow-hidden">
    {toast&&<div className={`fixed top-4 right-4 z-[100] px-5 py-3 rounded-xl shadow-lg text-sm font-semibold no-print ${toast.type==='err'?'bg-rose-600 text-white':'bg-emerald-600 text-white'}`}>{toast.msg}</div>}
    {saving&&<div className="fixed inset-0 bg-black/20 z-[90] flex items-center justify-center no-print"><div className="bg-white rounded-xl px-6 py-4 shadow-xl flex items-center gap-3"><i className="fa-solid fa-spinner fa-spin text-blue-600"></i><span className="font-semibold">Saving...</span></div></div>}
    <aside className="sidebar w-72 shrink-0 text-white no-print flex flex-col">
      <div className="px-6 py-6 border-b border-white/10"><div className="flex items-center gap-3"><div className="w-11 h-11 bg-blue-500 rounded-xl flex items-center justify-center text-xl"><i className="fa-solid fa-layer-group"></i></div><div><div className="font-extrabold text-xl">N4N Tracker</div><div className="text-xs text-blue-200">Supabase · Real-time</div></div></div></div>
      <nav className="p-3 space-y-1 flex-1 overflow-y-auto">{nav.map(n=><button key={n[0]} onClick={()=>setView(n[0])} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold transition ${view===n[0]?'active text-white':'text-blue-100 hover:bg-white/5'}`}><i className={`${n[1]} w-5`}></i>{n[2]}</button>)}</nav>
      <div className="p-4 border-t border-white/10">
        <div className="text-xs text-blue-200 mb-2 truncate">{session.user?.email}</div>
        <button onClick={logout} className="w-full text-left text-sm text-blue-100 hover:text-white flex items-center gap-2"><i className="fa-solid fa-right-from-bracket"></i> Sign out</button>
      </div>
    </aside>
    <section className="flex-1 min-w-0 flex flex-col">
      <header className="h-16 bg-white border-b px-6 flex items-center justify-between no-print">
        <div>
          <div className="font-bold text-slate-900">{nav.find(n=>n[0]===view)?.[2]}</div>
          <div className="text-xs text-slate-500">Giorgio Master Tracker · Cloud synchronized</div>
        </div>
        <div className="flex gap-2 items-center">
          {dataLoading&&<span className="text-xs text-slate-400"><i className="fa-solid fa-spinner fa-spin mr-1"></i>Loading...</span>}
          <button onClick={exportCSV} className="px-3 py-2 border rounded-lg text-sm font-semibold"><i className="fa-solid fa-download mr-2"></i>Export CSV</button>
          <button onClick={()=>window.print()} className="px-3 py-2 bg-blue-700 text-white rounded-lg text-sm font-semibold"><i className="fa-solid fa-print mr-2"></i>Print</button>
        </div>
      </header>
      <main className="flex-1 overflow-auto p-6">
        {seedNeeded&&(
          <div className="mb-6 p-5 bg-amber-50 border border-amber-200 rounded-2xl flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div className="font-bold text-amber-900">Database is empty</div>
              <p className="text-sm text-amber-800 mt-1">No households found. You can load the original Master Tracker data once.</p>
            </div>
            <button onClick={seedData} disabled={saving} className="shrink-0 px-5 py-2.5 bg-amber-600 text-white rounded-xl font-bold hover:bg-amber-700">
              {saving?'Loading...':'Load initial Master Tracker data'}
            </button>
          </div>
        )}
        {view==='dashboard'&&<Dashboard families={enriched} totalIndividuals={totalIndividuals} activeVouchers={activeVouchers} avgIncome={avgIncome} compliant={compliant} actionNeeded={actionNeeded} cmStats={cmStats}/>}
        {view==='households'&&<Households data={filtered} query={query} setQuery={setQuery} selected={selected} setSelectedId={setSelectedId} setEdit={setEdit} setDischargeEdit={setDischargeEdit} cmNames={cmNames} cmFilter={cmFilter} setCmFilter={setCmFilter} floorOptions={floorOptions} floorFilter={floorFilter} setFloorFilter={setFloorFilter}/>}
        {view==='housing'&&<Housing data={filtered} query={query} setQuery={setQuery} setEdit={setEdit} floorOptions={floorOptions} floorFilter={floorFilter} setFloorFilter={setFloorFilter} cmNames={cmNames} cmFilter={cmFilter} setCmFilter={setCmFilter}/>}
        {view==='case'&&<CaseManagement data={filtered} cmStats={cmStats} query={query} setQuery={setQuery} setEdit={setEdit} floorOptions={floorOptions} floorFilter={floorFilter} setFloorFilter={setFloorFilter}/>}
        {view==='discharge'&&<DischargeArchive data={discharges} restoreDischarge={restoreDischarge}/>}
        {view==='roster'&&<Roster activeFamilies={families}/>}
        {view==='reports'&&<Reports data={enriched} cmStats={cmStats} totalIndividuals={totalIndividuals}/>}
        {view==='protocol'&&<Protocol/>}
      </main>
    </section>
    {edit&&<EditModal edit={edit} setEdit={setEdit} save={save} saving={saving}/>}
    {dischargeEdit&&<DischargeModal record={dischargeEdit} setRecord={setDischargeEdit} close={()=>setDischargeEdit(null)} complete={completeDischarge}/>}
  </div>;
}

function Dashboard({families,totalIndividuals,activeVouchers,avgIncome,compliant,actionNeeded,cmStats}){
  const housed=families.filter(f=>['Housed','Linked'].includes(f.housingStatus)).length, employed=families.filter(f=>(f.employmentStatus||'').startsWith('Employed')).length;
  const vdist={}, hdist={};families.forEach(f=>{let v=f.voucherType||'(Blank)',h=f.housingStatus||'(Blank)';vdist[v]=(vdist[v]||0)+1;hdist[h]=(hdist[h]||0)+1});
  const voucherRef=useRef(),housingRef=useRef();
  useEffect(()=>{
    if(!voucherRef.current||!housingRef.current)return;
    let c1=new Chart(voucherRef.current,{type:'doughnut',data:{labels:Object.keys(vdist),datasets:[{data:Object.values(vdist)}]},options:{plugins:{legend:{position:'bottom'}},maintainAspectRatio:false}});
    let c2=new Chart(housingRef.current,{type:'bar',data:{labels:Object.keys(hdist),datasets:[{label:'Households',data:Object.values(hdist)}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}},maintainAspectRatio:false}});
    return()=>{c1.destroy();c2.destroy()};
  },[families]);
  return <div className="space-y-6"><div className="flex justify-between items-end"><div><h1 className="text-3xl font-extrabold">Executive Dashboard</h1><p className="text-slate-500 mt-1">Housing, resident, income and protocol performance at a glance.</p></div><div className="text-xs text-slate-500">Dynamic evaluation date: {new Date().toLocaleDateString()}</div></div>
  <div className="grid grid-cols-2 xl:grid-cols-6 gap-4"><KPI label="Households" value={families.length} icon="fa-solid fa-house"/><KPI label="Residents" value={totalIndividuals} icon="fa-solid fa-users"/><KPI label="Active Vouchers" value={activeVouchers} icon="fa-solid fa-ticket"/><KPI label="Housed / Linked" value={housed} icon="fa-solid fa-key"/><KPI label="Avg Income" value={money(avgIncome)} icon="fa-solid fa-dollar-sign"/><KPI label="Action Needed" value={actionNeeded} icon="fa-solid fa-triangle-exclamation" sub={`${compliant} fully compliant`}/></div>
  <div className="grid xl:grid-cols-2 gap-5"><div className="card p-5"><h3 className="font-bold mb-4">Voucher Type Distribution</h3><div className="h-72"><canvas ref={voucherRef}/></div></div><div className="card p-5"><h3 className="font-bold mb-4">Housing Pipeline</h3><div className="h-72"><canvas ref={housingRef}/></div></div></div>
  <div className="grid xl:grid-cols-3 gap-5"><div className="card p-5 xl:col-span-2"><h3 className="font-bold mb-4">Case Manager Performance</h3><div className="overflow-auto"><table className="w-full text-sm"><thead><tr className="text-left text-xs uppercase text-slate-500 border-b"><th className="py-2">Case Manager</th><th>Assigned</th><th>Full</th><th>Partial</th><th>Non</th><th>Effectiveness</th></tr></thead><tbody>{cmStats.map(c=><tr className="border-b" key={c.name}><td className="py-3 font-semibold">{c.name}</td><td>{c.total}</td><td className="text-emerald-700 font-bold">{c.full}</td><td className="text-amber-700">{c.partial}</td><td className="text-rose-700">{c.non}</td><td><span className="font-bold">{c.rate.toFixed(1)}%</span></td></tr>)}</tbody></table></div></div><div className="card p-5"><h3 className="font-bold mb-4">Program Snapshot</h3><div className="space-y-4 text-sm"><div className="flex justify-between"><span>Employment with data</span><b>{employed}</b></div><div className="flex justify-between"><span>AMA Eligible / Enrolled</span><b>{families.filter(f=>['Eligible','Enrolled'].includes(f.amaStatus)).length}</b></div><div className="flex justify-between"><span>ILP Compliant</span><b>{families.filter(f=>f.ilpStatus==='Compliant').length}</b></div><div className="flex justify-between"><span>Inspection Compliant</span><b>{families.filter(f=>f.inspStatus==='Compliant').length}</b></div><div className="flex justify-between"><span>Voucher exp. ≤30 days</span><b>{families.filter(f=>f.voucherDays!==null&&f.voucherDays<=30).length}</b></div></div></div></div>
  </div>;
}

function SearchBar({query,setQuery,extra}){return <div className="card p-3 flex gap-3 items-center no-print"><div className="relative flex-1"><i className="fa-solid fa-search absolute left-3 top-3 text-slate-400"></i><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search by unit, HOH, CARES ID, case manager, status..." className="w-full pl-10 pr-3 py-2 border rounded-lg"/></div>{extra}</div>}

function Households({data,query,setQuery,selected,setSelectedId,setEdit,setDischargeEdit,cmNames,cmFilter,setCmFilter,floorOptions=[],floorFilter,setFloorFilter}){
  const [lightbox,setLightbox]=useState(null);
  // Group by floor for organized list
  const grouped=useMemo(()=>{
    const map={};
    data.forEach(f=>{
      const fl=f.floor!=null?f.floor:'Other';
      if(!map[fl])map[fl]=[];
      map[fl].push(f);
    });
    return Object.keys(map).sort((a,b)=>{
      if(a==='Other')return 1; if(b==='Other')return -1;
      return Number(a)-Number(b);
    }).map(fl=>({floor:fl,items:map[fl]}));
  },[data]);
  return <div className="space-y-4">
    <SearchBar query={query} setQuery={setQuery} extra={<>
      <select value={floorFilter} onChange={e=>setFloorFilter(e.target.value)} className="border rounded-lg px-3 py-2" title="Filter by floor">
        <option value="All">All Floors</option>
        {floorOptions.map(fl=><option key={fl} value={fl}>Floor {fl}</option>)}
      </select>
      <select value={cmFilter} onChange={e=>setCmFilter(e.target.value)} className="border rounded-lg px-3 py-2">
        <option>All</option>{cmNames.map(x=><option key={x}>{x}</option>)}
      </select>
    </>}/>
    <div className="grid xl:grid-cols-[400px_1fr] gap-5 h-[calc(100vh-170px)]">
      <div className="card overflow-y-auto p-2">
        {grouped.map(g=>(
          <div key={g.floor} className="mb-3">
            <div className="sticky top-0 z-10 bg-slate-100 px-3 py-2 rounded-lg mb-2 flex items-center justify-between">
              <span className="text-xs font-bold uppercase tracking-wide text-slate-600">
                <i className="fa-solid fa-building mr-2 text-blue-600"></i>
                {g.floor==='Other'?'Other Units':`Floor ${g.floor}`}
              </span>
              <span className="text-xs font-semibold text-slate-500">{g.items.length} unit{g.items.length!==1?'s':''}</span>
            </div>
            {g.items.map(f=>(
              <button key={f.caresId} onClick={()=>setSelectedId(f.caresId)} className={`w-full text-left p-3 rounded-xl mb-2 border ${selected?.caresId===f.caresId?'border-blue-400 bg-blue-50':'border-slate-200 hover:bg-slate-50'}`}>
                <div className="flex gap-3 items-center">
                  <div className="w-12 h-12 rounded-xl overflow-hidden shrink-0 border bg-slate-100">
                    {f.photo?<img src={f.photo} className="w-full h-full family-photo" onError={e=>{e.target.style.display='none'}}/>:<div className="w-full h-full flex items-center justify-center text-blue-400"><i className="fa-solid fa-people-roof"></i></div>}
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="flex justify-between gap-2">
                      <b>Unit {f.unit}</b>

function Section({title,rows}){return <div className="border rounded-xl p-4"><h3 className="font-bold mb-3">{title}</h3><div className="space-y-2">{rows.map(([a,b])=><div className="flex justify-between gap-4 text-sm border-b last:border-0 pb-2 last:pb-0" key={a}><span className="text-slate-500">{a}</span><b className="text-right">{b}</b></div>)}</div></div>}

function Housing({data,query,setQuery,setEdit,floorOptions=[],floorFilter,setFloorFilter,cmNames=[],cmFilter,setCmFilter}){return <div className="space-y-4"><SearchBar query={query} setQuery={setQuery} extra={<>
  <select value={floorFilter} onChange={e=>setFloorFilter(e.target.value)} className="border rounded-lg px-3 py-2"><option value="All">All Floors</option>{floorOptions.map(fl=><option key={fl} value={fl}>Floor {fl}</option>)}</select>

function CaseManagement({data,cmStats,query,setQuery,setEdit,floorOptions=[],floorFilter,setFloorFilter}){return <div className="space-y-5"><div className="grid md:grid-cols-3 gap-4">{cmStats.map(c=><div className="card p-4" key={c.name}><div className="font-bold">{c.name}</div><div className="grid grid-cols-2 gap-2 text-sm mt-3"><span>Assigned <b>{c.total}</b></span><span>Effectiveness <b>{c.rate.toFixed(1)}%</b></span><span className="text-emerald-700">Full <b>{c.full}</b></span><span className="text-rose-700">Non <b>{c.non}</b></span></div></div>)}</div><SearchBar query={query} setQuery={setQuery} extra={<select value={floorFilter} onChange={e=>setFloorFilter(e.target.value)} className="border rounded-lg px-3 py-2"><option value="All">All Floors</option>{floorOptions.map(fl=><option key={fl} value={fl}>Floor {fl}</option>)}</select>}/><div className="card overflow-auto"><table className="min-w-[1350px] w-full text-sm"><thead className="bg-blue-950 text-white text-xs uppercase sticky top-0"><tr>{['Room','HOH','Language','CARES ID','Composition','Case Manager','Last ILP','ILP Status','Next Meeting','Last Inspection','Inspection','Metrics','Overall','Action Needed','Update'].map(x=><th className="p-3 text-left" key={x}>{x}</th>)}</tr></thead><tbody>{data.map(f=><tr className="border-b" key={f.caresId}><td className="p-3 font-bold">{f.unit}</td><td className="font-semibold">{f.hohName}</td><td>{f.language||'—'}</td><td>{f.caresId}</td><td>{f.householdSize} ({f.adults}A/{f.children}C)</td><td>{f.caseManager}</td><td>{fmt(f.lastILP)}</td><td><span className={`badge ${pill(f.ilpStatus)}`}>{f.ilpStatus}</span></td><td>{fmt(f.nextMeetingCalc)}</td><td>{fmt(f.lastInspection)}</td><td><span className={`badge ${pill(f.inspStatus)}`}>{f.inspStatus}</span></td><td>{f.metrics} / 2</td><td><span className={`badge ${pill(f.overall)}`}>{f.overall}</span></td><td className="text-xs">{f.action||'—'}</td><td><button onClick={()=>setEdit({...f})} className="text-blue-700 font-bold">Update</button></td></tr>)}</tbody></table></div></div>}

function Roster({activeFamilies}){

  let rows=SOURCE_ROSTER.filter(r=>activeIds.has(String(r.caresId))).filter(r=>!q||Object.values(r).some(v=>(v||'').toString().toLowerCase().includes(q.toLowerCase())));

function DischargeModal({record,setRecord,close,complete}){
  let set=(k,v)=>setRecord(r=>({...r,[k]:v}));
  const reasons=['Permanent Housing','Family Reunification','Transfer to Another Shelter/Program','Self-Discharge','Left Without Notice','Program Completion','Administrative Discharge','Other'];
  return <div className="fixed inset-0 bg-slate-950/55 z-[70] flex items-center justify-center p-5 no-print"><div className="bg-white w-full max-w-3xl rounded-2xl shadow-2xl overflow-hidden"><div className="p-5 border-b flex justify-between"><div><h2 className="text-xl font-extrabold">Complete Family Discharge</h2><div className="text-xs text-slate-500 mt-1">Unit {record.unit} · {record.hohName} · CARES {record.caresId}</div></div><button onClick={close}><i className="fa-solid fa-xmark text-xl"></i></button></div><div className="p-6 space-y-5"><div className="p-4 rounded-xl bg-amber-50 border border-amber-200 text-sm text-amber-900"><b>Audit protection:</b> se crea una copia histórica completa. El registro activo se elimina de perfiles, housing, case management y reportes.</div><div className="grid md:grid-cols-2 gap-4"><Field label="Discharge Date *" type="date" value={record.dischargeDate} onChange={v=>set('dischargeDate',v)}/><Field label="Discharge Reason *" value={record.dischargeReason} options={reasons} onChange={v=>set('dischargeReason',v)}/><Field label="Discharge Destination / Placement" value={record.dischargeDestination} onChange={v=>set('dischargeDestination',v)}/><Field label="Completed By" value={record.dischargeStaff} onChange={v=>set('dischargeStaff',v)}/></div><label className="block"><span className="text-xs font-bold uppercase text-slate-500">Discharge Notes / Final Outcome</span><textarea value={record.dischargeNotes||''} onChange={e=>set('dischargeNotes',e.target.value)} rows="5" className="mt-1 w-full border rounded-lg p-3"></textarea></label></div><div className="p-4 border-t flex justify-end gap-3"><button onClick={close} className="px-4 py-2 border rounded-lg font-semibold">Cancel</button><button onClick={complete} className="px-5 py-2 bg-rose-700 text-white rounded-lg font-semibold"><i className="fa-solid fa-check mr-2"></i>Complete & Archive</button></div></div></div>;
}

function DischargeArchive({data,restoreDischarge}){
  const [q,setQ]=useState(''); const [selected,setSelected]=useState(null);
  let rows=data.filter(f=>!q||[f.unit,f.hohName,f.caresId,f.caseManager,f.dischargeReason,f.dischargeDestination,f.dischargeStaff].some(v=>(v||'').toString().toLowerCase().includes(q.toLowerCase())));
  const exportDischarges=()=>{let cols=['dischargeDate','unit','hohName','caresId','caseManager','dischargeReason','dischargeDestination','dischargeStaff','dischargeNotes','intakeDate','adults','children','housingStatus','voucherType','employmentStatus','monthlyIncome','caseNotes'];let esc=v=>'"'+String(v??'').replaceAll('"','""')+'"';let csv=[cols.join(','),...rows.map(f=>cols.map(c=>esc(f[c])).join(','))].join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='N4N_Discharge_Audit_Export.csv';a.click()};
  return <div className="space-y-5"><div className="flex items-end justify-between"><div><h1 className="text-3xl font-extrabold">Discharge Archive & Audit</h1><p className="text-slate-500 mt-1">Closed household records retained with discharge dates and final outcomes.</p></div><button onClick={exportDischarges} className="no-print px-4 py-2 border rounded-lg font-semibold"><i className="fa-solid fa-download mr-2"></i>Export Discharge CSV</button></div><div className="grid md:grid-cols-3 gap-4"><KPI label="Total Discharges" value={data.length} icon="fa-solid fa-box-archive"/><KPI label="This Month" value={data.filter(f=>String(f.dischargeDate||'').slice(0,7)===new Date().toISOString().slice(0,7)).length} icon="fa-solid fa-calendar-check"/><KPI label="Residents Archived" value={data.reduce((a,f)=>a+(Number(f.adults)||0)+(Number(f.children)||0),0)} icon="fa-solid fa-users"/></div><SearchBar query={q} setQuery={setQ}/><div className="card overflow-auto"><table className="min-w-[1250px] w-full text-sm"><thead className="bg-slate-900 text-white text-xs uppercase sticky top-0"><tr>{['Discharge Date','Unit','Head of Household','CARES ID','Case Manager','Reason','Destination','Completed By','Residents','Audit Record'].map(x=><th className="p-3 text-left" key={x}>{x}</th>)}</tr></thead><tbody>{rows.map((f,i)=><tr className="border-b" key={f.dischargedAt||i}><td className="p-3 font-bold">{fmt(f.dischargeDate)}</td><td>{f.unit}</td><td className="font-semibold">{f.hohName}</td><td>{f.caresId}</td><td>{f.caseManager||'—'}</td><td><span className="badge bg-rose-100 text-rose-700">{f.dischargeReason}</span></td><td>{f.dischargeDestination||'—'}</td><td>{f.dischargeStaff||'—'}</td><td>{(Number(f.adults)||0)+(Number(f.children)||0)}</td><td><button onClick={()=>setSelected(f)} className="text-blue-700 font-bold mr-3">View</button><button onClick={()=>restoreDischarge(f)} className="text-emerald-700 font-bold">Restore</button></td></tr>)}</tbody></table>{!rows.length&&<div className="p-10 text-center text-slate-500">No discharged households found.</div>}</div>{selected&&<DischargeDetail record={selected} close={()=>setSelected(null)}/>}</div>;
}

function DischargeDetail({record,close}){
  return <div className="fixed inset-0 bg-slate-950/55 z-[70] flex items-center justify-center p-5"><div className="bg-white w-full max-w-5xl max-h-[92vh] overflow-y-auto rounded-2xl shadow-2xl"><div className="sticky top-0 bg-white border-b p-5 flex justify-between z-10"><div><div className="text-xs font-bold uppercase text-rose-700">Archived Discharge Record</div><h2 className="text-xl font-extrabold">{record.hohName}</h2><div className="text-xs text-slate-500">Unit {record.unit} · CARES {record.caresId}</div></div><button onClick={close}><i className="fa-solid fa-xmark text-xl"></i></button></div><div className="p-6 space-y-5"><div className="grid md:grid-cols-4 gap-3">{[['Discharge Date',fmt(record.dischargeDate)],['Reason',record.dischargeReason||'—'],['Destination',record.dischargeDestination||'—'],['Completed By',record.dischargeStaff||'—']].map(([a,b])=><div className="bg-rose-50 border border-rose-100 rounded-xl p-3" key={a}><div className="text-xs uppercase font-bold text-rose-700">{a}</div><div className="font-bold mt-1">{b}</div></div>)}</div><Section title="Original Family Profile" rows={[['Intake Date',fmt(record.intakeDate)],['Case Manager',record.caseManager||'—'],['Phone',record.phone||'—'],['Language',record.language||'—'],['Household',`${record.adults||0} adults / ${record.children||0} children`],['Housing Status',record.housingStatus||'—'],['Voucher Type',record.voucherType||'—'],['Employment',record.employmentStatus||'—'],['Monthly Income',money(record.monthlyIncome)]]}/><div className="border rounded-xl p-4"><h3 className="font-bold mb-2">Discharge Notes</h3><div className="text-sm whitespace-pre-wrap">{record.dischargeNotes||'No notes.'}</div></div><div className="border rounded-xl p-4"><h3 className="font-bold mb-2">Historical Case Notes</h3><div className="text-sm whitespace-pre-wrap">{record.caseNotes||'No case notes.'}</div></div></div></div></div>;

function Reports({data,cmStats,totalIndividuals}){
  let languages={},employment={},ama={},adults=data.reduce((a,f)=>a+Number(f.adults||0),0),children=data.reduce((a,f)=>a+Number(f.children||0),0);
  data.forEach(f=>{if(f.language)languages[f.language]=(languages[f.language]||0)+1;if(f.employmentStatus)employment[f.employmentStatus]=(employment[f.employmentStatus]||0)+1;if(f.amaStatus)ama[f.amaStatus]=(ama[f.amaStatus]||0)+1});
  let Table=({title,obj})=><div className="card p-5"><h3 className="font-bold mb-3">{title}</h3>{Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=><div className="flex justify-between py-2 border-b text-sm" key={k}><span>{k}</span><b>{v}</b></div>)}</div>;
  return <div className="space-y-5"><div><h1 className="text-3xl font-extrabold">Management Report</h1><p className="text-slate-500">Printable operational summary from live cloud data.</p></div><div className="grid md:grid-cols-4 gap-4"><KPI label="Households" value={data.length} icon="fa-solid fa-house"/><KPI label="Residents" value={totalIndividuals} icon="fa-solid fa-users"/><KPI label="Adults" value={adults} icon="fa-solid fa-person"/><KPI label="Children" value={children} icon="fa-solid fa-child"/></div><div className="grid lg:grid-cols-3 gap-5"><Table title="Languages" obj={languages}/><Table title="Employment" obj={employment}/><Table title="AMA Status" obj={ama}/></div><div className="card p-5"><h3 className="font-bold mb-4">Case Manager Audit Summary</h3><table className="w-full text-sm"><thead><tr className="border-b text-left"><th className="py-2">Case Manager</th><th>Assigned</th><th>Fully Compliant</th><th>Partial</th><th>Non-Compliant</th><th>Effectiveness</th></tr></thead><tbody>{cmStats.map(c=><tr className="border-b" key={c.name}><td className="py-3 font-semibold">{c.name}</td><td>{c.total}</td><td>{c.full}</td><td>{c.partial}</td><td>{c.non}</td><td>{c.rate.toFixed(1)}%</td></tr>)}</tbody></table></div></div>;
}

function Protocol(){
  return <div className="max-w-4xl space-y-5"><div className="card p-6"><h1 className="text-2xl font-extrabold">Protocol Benchmark Standards</h1><p className="text-slate-500 mt-1">Rules carried from the Master Tracker workbook.</p><div className="grid md:grid-cols-2 gap-4 mt-6"><div className="border rounded-xl p-5"><div className="text-sm font-bold text-blue-700">ILP / Case Note Update</div><div className="text-3xl font-extrabold mt-2">15 days</div><p className="text-sm text-slate-500 mt-2">ILP and Case Notes updated together during the same client meeting.</p></div><div className="border rounded-xl p-5"><div className="text-sm font-bold text-blue-700">Unit Inspection</div><div className="text-3xl font-extrabold mt-2">15 days</div><p className="text-sm text-slate-500 mt-2">Physical unit inspection required every 15 days.</p></div></div></div><div className="card p-6"><h2 className="font-bold">Data behavior (Supabase)</h2><ul className="mt-3 space-y-2 text-sm text-slate-600 list-disc pl-5"><li>All data is stored in Supabase and synchronized in real time across all users.</li><li>Photos are stored in Supabase Storage (compressed, never as giant base64).</li><li>Authentication required — only authorized staff can access.</li><li>Household size = Adults + Children. Next meeting = Last ILP + 15 days.</li><li>Discharges are archived with full historical snapshot for audit.</li></ul></div></div>;
}

function EditModal({edit,setEdit,save,saving}){
  let set=(k,v)=>setEdit(e=>({...e,[k]:v}));
  const [uploading,setUploading]=useState(false);
  const handlePhoto=async(e)=>{
    const file=e.target.files?.[0];
    e.target.value='';
    if(!file)return;
    setUploading(true);
    try{
      const blob=await compressImage(file,900,0.75);
      const previewUrl=URL.createObjectURL(blob);
      setEdit(prev=>({...prev,photo:previewUrl,_photoFile:blob}));
    }catch(err){
      alert('Could not process image: '+(err.message||err));
    }finally{setUploading(false);}
  };
  return <div className="fixed inset-0 bg-slate-950/50 z-50 flex items-center justify-center p-5 no-print">
    <div className="bg-white w-full max-w-5xl max-h-[92vh] overflow-y-auto rounded-2xl shadow-2xl">
      <div className="sticky top-0 bg-white border-b p-5 flex justify-between z-10">
        <div><h2 className="text-xl font-extrabold">Edit Family Profile</h2><div className="text-xs text-slate-500">Unit {edit.unit} · CARES {edit.caresId}</div></div>
        <button onClick={()=>setEdit(null)}><i className="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div className="p-6 space-y-6">
        <div className="rounded-2xl border border-blue-100 bg-blue-50/50 p-4">
          <div className="flex flex-col md:flex-row md:items-center gap-4">
            <div className="w-24 h-24 rounded-2xl overflow-hidden border bg-white shrink-0">
              {uploading?<div className="w-full h-full flex items-center justify-center text-blue-500"><i className="fa-solid fa-spinner fa-spin text-2xl"></i></div>:
               edit.photo?<img src={edit.photo} className="w-full h-full family-photo"/>:
               <div className="w-full h-full flex items-center justify-center text-slate-300"><i className="fa-solid fa-people-roof text-3xl"></i></div>}
            </div>
            <div className="flex-1">
              <div className="font-bold text-slate-800">Family Identification Photo</div>
              <p className="text-xs text-slate-500 mt-1">Photo is compressed and uploaded to Supabase Storage. It will appear on every user's profile in real time.</p>
              <div className="flex gap-2 mt-3">
                <label className="cursor-pointer px-3 py-2 bg-white border rounded-lg text-sm font-semibold">
                  <i className="fa-solid fa-camera mr-2 text-blue-600"></i>Upload Photo
                  <input type="file" accept="image/*" className="hidden" onChange={handlePhoto}/>
                </label>
                {edit.photo&&<button type="button" onClick={()=>setEdit(e=>{const n={...e,photo:'',_photoFile:null};return n;})} className="px-3 py-2 border border-rose-200 text-rose-700 rounded-lg text-sm font-semibold">Remove Photo</button>}
              </div>
            </div>
          </div>
        </div>
        <div className="grid md:grid-cols-4 gap-4">
          <Field label="Unit" value={edit.unit} onChange={v=>set('unit',v)}/>
          <Field label="HOH Full Name" value={edit.hohName} onChange={v=>set('hohName',v)}/>
          <Field label="CARES ID" value={edit.caresId} onChange={v=>set('caresId',v)} disabled/>
          <Field label="Phone" value={edit.phone} onChange={v=>set('phone',v)}/>
          <Field label="Language" value={edit.language} options={LISTS.Language||[]} onChange={v=>set('language',v)}/>
          <Field label="Intake Date" type="date" value={edit.intakeDate} onChange={v=>set('intakeDate',v)}/>
          <Field label="Adults" type="number" value={edit.adults} onChange={v=>set('adults',v)}/>
          <Field label="Children" type="number" value={edit.children} onChange={v=>set('children',v)}/>
        </div>
        <hr/>
        <div className="grid md:grid-cols-4 gap-4">
          <Field label="Housing Status" value={edit.housingStatus} options={LISTS.Housing_Status||[]} onChange={v=>set('housingStatus',v)}/>
          <Field label="Voucher Type" value={edit.voucherType} options={LISTS.Voucher_Type||[]} onChange={v=>set('voucherType',v)}/>
          <Field label="Voucher Status" value={edit.voucherStatus} options={LISTS.Voucher_Status||[]} onChange={v=>set('voucherStatus',v)}/>
          <Field label="Bedroom Size" value={edit.bedroomSize} options={LISTS.Bedroom_Size||[]} onChange={v=>set('bedroomSize',v)}/>
          <Field label="Voucher Amount" type="number" value={edit.voucherAmount} onChange={v=>set('voucherAmount',v)}/>
          <Field label="Client Portion" type="number" value={edit.clientPortion} onChange={v=>set('clientPortion',v)}/>
          <Field label="Voucher Expiration" type="date" value={edit.voucherExpDate} onChange={v=>set('voucherExpDate',v)}/>
          <Field label="Public Assistance" value={edit.publicAssistance} options={LISTS.PA_Status||[]} onChange={v=>set('publicAssistance',v)}/>
        </div>
        <hr/>
        <div className="grid md:grid-cols-4 gap-4">
          <Field label="AMA Program" value={edit.amaProgram} options={LISTS.AMA_Program||[]} onChange={v=>set('amaProgram',v)}/>
          <Field label="AMA Status" value={edit.amaStatus} options={LISTS.AMA_Status||[]} onChange={v=>set('amaStatus',v)}/>
          <Field label="Employment" value={edit.employmentStatus} options={LISTS.Employment_Status||[]} onChange={v=>set('employmentStatus',v)}/>
          <Field label="Job Training" value={edit.jobTraining} options={LISTS.Job_Training||[]} onChange={v=>set('jobTraining',v)}/>
          <Field label="Monthly Income" type="number" value={edit.monthlyIncome} onChange={v=>set('monthlyIncome',v)}/>
          <Field label="Income Source" value={edit.incomeSource} options={LISTS.Income_Source||[]} onChange={v=>set('incomeSource',v)}/>
          <Field label="Case Manager" value={edit.caseManager} onChange={v=>set('caseManager',v)}/>
          <Field label="Last ILP / Case Note" type="date" value={edit.lastILP} onChange={v=>set('lastILP',v)}/>
          <Field label="Last Inspection" type="date" value={edit.lastInspection} onChange={v=>set('lastInspection',v)}/>
        </div>
        <label className="block"><span className="text-xs font-bold uppercase text-slate-500">Case Notes</span><textarea value={edit.caseNotes||''} onChange={e=>set('caseNotes',e.target.value)} rows="5" className="mt-1 w-full border rounded-lg p-3"></textarea></label>
      </div>
      <div className="sticky bottom-0 bg-white border-t p-4 flex justify-end gap-3">
        <button onClick={()=>setEdit(null)} className="px-4 py-2 border rounded-lg font-semibold">Cancel</button>
        <button onClick={save} disabled={saving||uploading} className="px-5 py-2 bg-blue-700 text-white rounded-lg font-semibold disabled:opacity-50">
          {saving?'Saving...':'Save & Sync'}
        </button>
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
