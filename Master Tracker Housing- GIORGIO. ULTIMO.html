const PROTOCOL={ilpDays:15,inspectionDays:15};

const money=v=>v===null||v===undefined||v===''?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(v)||0);
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US'): '—';
const daysBetween=(a,b)=>{if(!a||!b)return null;return Math.floor((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)};
const todayISO=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{if(!d)return'';let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const compliance=f=>{
 const today=todayISO(); const ilpAge=daysBetween(f.lastILP,today), inspAge=daysBetween(f.lastInspection,today);
 const ilp=ilpAge!==null&&ilpAge<=PROTOCOL.ilpDays, insp=inspAge!==null&&inspAge<=PROTOCOL.inspectionDays;
 const metrics=(ilp?1:0)+(insp?1:0);
 return {ilpStatus:ilp?'Compliant':'Overdue',inspStatus:insp?'Compliant':'Overdue',metrics,
 overall:metrics===2?'100% Compliant':metrics===1?'Partially Compliant':'Non-Compliant',
 action:metrics===2?'':(!ilp&&!insp?'ILP/Case Note and Inspection update needed':!ilp?'ILP/Case Note update needed':'Inspection needed')};
};

 if(s.includes('partial')||s.includes('pending')||s==='searching'||s.includes('progress'))return'bg-amber-100 text-amber-700';
 return'bg-slate-100 text-slate-700';
};

function App(){
 const [families,setFamilies]=useState(()=>JSON.parse(localStorage.getItem('n4nFamiliesV6')||'null')||SOURCE_FAMILIES);

 useEffect(()=>localStorage.setItem('n4nFamiliesV6',JSON.stringify(families)),[families]);
 useEffect(()=>localStorage.setItem('n4nDischargesV1',JSON.stringify(discharges)),[discharges]);
 const enriched=useMemo(()=>families.map(f=>{let c=compliance(f);return{...f,...c,householdSize:(Number(f.adults)||0)+(Number(f.children)||0),voucherDays:voucherDays(f),nextMeetingCalc:addDays(f.lastILP,15)}}),[families]);
 const selected=enriched.find(f=>f.caresId===selectedId)||enriched[0];

 const compliant=enriched.filter(f=>f.overall==='100% Compliant').length, actionNeeded=enriched.filter(f=>f.action).length;
 const cmNames=[...new Set(enriched.map(f=>f.caseManager).filter(Boolean))];
 const filtered=enriched.filter(f=>{let q=query.toLowerCase(); return (!q||[f.unit,f.hohName,f.caresId,f.caseManager,f.housingStatus,f.voucherType].some(v=>(v||'').toString().toLowerCase().includes(q)))&&(cmFilter==='All'||f.caseManager===cmFilter)});
 const cmStats=cmNames.map(name=>{let a=enriched.filter(f=>f.caseManager===name),full=a.filter(f=>f.overall==='100% Compliant').length,partial=a.filter(f=>f.overall==='Partially Compliant').length,non=a.filter(f=>f.overall==='Non-Compliant').length;return{name,total:a.length,full,partial,non,rate:a.length?(full/a.length*100):0}});

 const reset=()=>{if(confirm('Restore the original Master Tracker data and remove browser edits?')){localStorage.removeItem('n4nFamiliesV6');localStorage.removeItem('n4nDischargesV1');setFamilies(SOURCE_FAMILIES);setDischarges([]);setSelectedId(SOURCE_FAMILIES[0].caresId)}};

function DischargeArchive({data,restoreDischarge}){const [q,setQ]=useState('');const [selected,setSelected]=useState(null);let rows=data.filter(f=>!q||[f.unit,f.hohName,f.caresId,f.caseManager,f.dischargeReason,f.dischargeDestination,f.dischargeStaff].some(v=>(v||'').toString().toLowerCase().includes(q.toLowerCase())));const exportDischarges=()=>{let cols=['dischargeDate','unit','hohName','caresId','caseManager','dischargeReason','dischargeDestination','dischargeStaff','dischargeNotes','intakeDate','adults','children','housingStatus','voucherType','employmentStatus','monthlyIncome','caseNotes'];let esc=v=>'"'+String(v??'').replaceAll('"','""')+'"';let csv=[cols.join(','),...rows.map(f=>cols.map(c=>esc(f[c])).join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='N4N_Discharge_Audit_Export.csv';a.click()};return <div className="space-y-5"><div className="flex items-end justify-between"><div><h1 className="text-3xl font-extrabold">Discharge Archive & Audit</h1><p className="text-slate-500 mt-1">Closed household records are retained here with discharge dates and final outcomes.</p></div><button onClick={exportDischarges} className="no-print px-4 py-2 border rounded-lg font-semibold"><i className="fa-solid fa-download mr-2"></i>Export Discharge CSV</button></div><div className="grid md:grid-cols-3 gap-4"><KPI label="Total Discharges" value={data.length} icon="fa-solid fa-box-archive"/><KPI label="This Month" value={data.filter(f=>String(f.dischargeDate||'').slice(0,7)===new Date().toISOString().slice(0,7)).length} icon="fa-solid fa-calendar-check"/><KPI label="Residents Archived" value={data.reduce((a,f)=>a+(Number(f.adults)||0)+(Number(f.children)||0),0)} icon="fa-solid fa-users"/></div><SearchBar query={q} setQuery={setQ}/><div className="card overflow-auto"><table className="min-w-[1250px] w-full text-sm"><thead className="bg-slate-900 text-white text-xs uppercase sticky top-0"><tr>{['Discharge Date','Unit','Head of Household','CARES ID','Case Manager','Reason','Destination','Completed By','Residents','Audit Record'].map(x=><th className="p-3 text-left" key={x}>{x}</th>)}</tr></thead><tbody>{rows.map((f,i)=><tr className="border-b" key={f.dischargedAt||i}><td className="p-3 font-bold">{fmt(f.dischargeDate)}</td><td>{f.unit}</td><td className="font-semibold">{f.hohName}</td><td>{f.caresId}</td><td>{f.caseManager||'—'}</td><td><span className="badge bg-rose-100 text-rose-700">{f.dischargeReason}</span></td><td>{f.dischargeDestination||'—'}</td><td>{f.dischargeStaff||'—'}</td><td>{(Number(f.adults)||0)+(Number(f.children)||0)}</td><td><button onClick={()=>setSelected(f)} className="text-blue-700 font-bold mr-3">View</button><button onClick={()=>restoreDischarge(f)} className="text-emerald-700 font-bold">Restore</button></td></tr>)}</tbody></table>{!rows.length&&<div className="p-10 text-center text-slate-500">No discharged households found.</div>}</div>{selected&&<DischargeDetail record={selected} close={()=>setSelected(null)}/>}</div>}
function DischargeDetail({record,close}){return <div className="fixed inset-0 bg-slate-950/55 z-[70] flex items-center justify-center p-5"><div className="bg-white w-full max-w-5xl max-h-[92vh] overflow-y-auto rounded-2xl shadow-2xl"><div className="sticky top-0 bg-white border-b p-5 flex justify-between z-10"><div><div className="text-xs font-bold uppercase text-rose-700">Archived Discharge Record</div><h2 className="text-xl font-extrabold">{record.hohName}</h2><div className="text-xs text-slate-500">Unit {record.unit} · CARES {record.caresId}</div></div><button onClick={close}><i className="fa-solid fa-xmark text-xl"></i></button></div><div className="p-6 space-y-5"><div className="grid md:grid-cols-4 gap-3">{[['Discharge Date',fmt(record.dischargeDate)],['Reason',record.dischargeReason||'—'],['Destination',record.dischargeDestination||'—'],['Completed By',record.dischargeStaff||'—']].map(([a,b])=><div className="bg-rose-50 border border-rose-100 rounded-xl p-3" key={a}><div className="text-xs uppercase font-bold text-rose-700">{a}</div><div className="font-bold mt-1">{b}</div></div>)}</div><Section title="Original Family Profile" rows={[['Intake Date',fmt(record.intakeDate)],['Case Manager',record.caseManager||'—'],['Phone',record.phone||'—'],['Language',record.language||'—'],['Household',`${record.adults||0} adults / ${record.children||0} children`],['Housing Status',record.housingStatus||'—'],['Voucher Type',record.voucherType||'—'],['Employment',record.employmentStatus||'—'],['Monthly Income',money(record.monthlyIncome)]]}/><div className="border rounded-xl p-4"><h3 className="font-bold mb-2">Discharge Notes / Final Outcome</h3><div className="text-sm whitespace-pre-wrap">{record.dischargeNotes||'No discharge notes entered.'}</div></div><div className="border rounded-xl p-4"><h3 className="font-bold mb-2">Historical Case Notes</h3><div className="text-sm whitespace-pre-wrap">{record.caseNotes||'No case notes entered.'}</div></div><div><h3 className="font-bold mb-3">Archived Household Members ({record.members?.length||0})</h3><div className="overflow-auto border rounded-xl"><table className="w-full text-sm"><thead className="bg-slate-50"><tr><th className="p-3 text-left">Name</th><th>CARES ID</th><th>Age</th><th>Gender</th><th>HOH</th></tr></thead><tbody>{(record.members||[]).map((m,i)=><tr className="border-t" key={i}><td className="p-3 font-semibold">{m.firstName} {m.lastName}</td><td className="text-center">{m.caresId}</td><td className="text-center">{m.age}</td><td className="text-center">{m.gender}</td><td className="text-center">{m.hoh?'Yes':''}</td></tr>)}</tbody></table></div></div></div></div></div>}
function Reports({data,cmStats,totalIndividuals}){let languages={},employment={},ama={},adults=data.reduce((a,f)=>a+Number(f.adults||0),0),children=data.reduce((a,f)=>a+Number(f.children||0),0);data.forEach(f=>{if(f.language)languages[f.language]=(languages[f.language]||0)+1;if(f.employmentStatus)employment[f.employmentStatus]=(employment[f.employmentStatus]||0)+1;if(f.amaStatus)ama[f.amaStatus]=(ama[f.amaStatus]||0)+1});let Table=({title,obj})=><div className="card p-5"><h3 className="font-bold mb-3">{title}</h3>{Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=><div className="flex justify-between py-2 border-b text-sm" key={k}><span>{k}</span><b>{v}</b></div>)}</div>;return <div className="space-y-5"><div><h1 className="text-3xl font-extrabold">Management Report</h1><p className="text-slate-500">Printable operational summary generated from current browser data.</p></div><div className="grid md:grid-cols-4 gap-4"><KPI label="Households" value={data.length} icon="fa-solid fa-house"/><KPI label="Residents (calculated)" value={totalIndividuals} icon="fa-solid fa-users"/><KPI label="Adults" value={adults} icon="fa-solid fa-person"/><KPI label="Children" value={children} icon="fa-solid fa-child"/></div><div className="grid lg:grid-cols-3 gap-5"><Table title="Languages" obj={languages}/><Table title="Employment" obj={employment}/><Table title="AMA Status" obj={ama}/></div><div className="card p-5"><h3 className="font-bold mb-4">Case Manager Audit Summary</h3><table className="w-full text-sm"><thead><tr className="border-b text-left"><th className="py-2">Case Manager</th><th>Assigned</th><th>Fully Compliant</th><th>Partial</th><th>Non-Compliant</th><th>Effectiveness</th></tr></thead><tbody>{cmStats.map(c=><tr className="border-b" key={c.name}><td className="py-3 font-semibold">{c.name}</td><td>{c.total}</td><td>{c.full}</td><td>{c.partial}</td><td>{c.non}</td><td>{c.rate.toFixed(1)}%</td></tr>)}</tbody></table></div></div>}
function Protocol({reset}){return <div className="max-w-4xl space-y-5"><div className="card p-6"><h1 className="text-2xl font-extrabold">Protocol Benchmark Standards</h1><p className="text-slate-500 mt-1">Rules carried from the Master Tracker workbook.</p><div className="grid md:grid-cols-2 gap-4 mt-6"><div className="border rounded-xl p-5"><div className="text-sm font-bold text-blue-700">ILP / Case Note Update</div><div className="text-3xl font-extrabold mt-2">15 days</div><p className="text-sm text-slate-500 mt-2">ILP and Case Notes are treated as updated together during the same client meeting.</p></div><div className="border rounded-xl p-5"><div className="text-sm font-bold text-blue-700">Unit Inspection</div><div className="text-3xl font-extrabold mt-2">15 days</div><p className="text-sm text-slate-500 mt-2">Physical unit inspection required every 15 days.</p></div></div></div><div className="card p-6"><h2 className="font-bold">Data behavior</h2><ul className="mt-3 space-y-2 text-sm text-slate-600 list-disc pl-5"><li>Household size = Adults + Children.</li><li>Next meeting = Last ILP / Case Note + 15 days.</li><li>Voucher days remaining calculate against the current date.</li><li>Overall compliance is calculated from ILP and inspection timeliness.</li><li>Edits persist in this browser using localStorage.</li><li>Completed discharges are automatically removed from active caseloads and preserved in the Discharge Archive with the discharge date and full historical profile for audit/reporting.</li></ul><button onClick={reset} className="no-print mt-5 px-4 py-2 border border-rose-300 text-rose-700 rounded-lg font-semibold">Restore Original Master Data</button></div></div>}
function EditModal({edit,setEdit,save}){let set=(k,v)=>setEdit(e=>({...e,[k]:v}));return <div className="fixed inset-0 bg-slate-950/50 z-50 flex items-center justify-center p-5 no-print"><div className="bg-white w-full max-w-5xl max-h-[92vh] overflow-y-auto rounded-2xl shadow-2xl"><div className="sticky top-0 bg-white border-b p-5 flex justify-between z-10"><div><h2 className="text-xl font-extrabold">Edit Family Profile</h2><div className="text-xs text-slate-500">Unit {edit.unit} · CARES {edit.caresId}</div></div><button onClick={()=>setEdit(null)}><i className="fa-solid fa-xmark text-xl"></i></button></div><div className="p-6 space-y-6"><div className="rounded-2xl border border-blue-100 bg-blue-50/50 p-4"><div className="flex flex-col md:flex-row md:items-center gap-4"><div className="w-24 h-24 rounded-2xl overflow-hidden border bg-white shrink-0">{edit.photo?<img src={edit.photo} className="w-full h-full family-photo"/>:<div className="w-full h-full flex items-center justify-center text-slate-300"><i className="fa-solid fa-people-roof text-3xl"></i></div>}</div><div className="flex-1"><div className="font-bold text-slate-800">Family Identification Photo</div><p className="text-xs text-slate-500 mt-1">Upload a family photo. It will appear on the Family Profile and can be clicked to expand for a larger view.</p><div className="flex gap-2 mt-3"><label className="cursor-pointer px-3 py-2 bg-white border rounded-lg text-sm font-semibold"><i className="fa-solid fa-camera mr-2 text-blue-600"></i>Upload Photo<input type="file" accept="image/*" className="hidden" onChange={e=>{const file=e.target.files?.[0];if(file){const r=new FileReader();r.onload=()=>set('photo',r.result);r.readAsDataURL(file)}}}/></label>{edit.photo&&<button type="button" onClick={()=>set('photo','')} className="px-3 py-2 border border-rose-200 text-rose-700 rounded-lg text-sm font-semibold">Remove Photo</button>}</div></div></div></div><div className="grid md:grid-cols-4 gap-4"><Field label="Unit" value={edit.unit} onChange={v=>set('unit',v)}/><Field label="HOH Full Name" value={edit.hohName} onChange={v=>set('hohName',v)}/><Field label="CARES ID" value={edit.caresId} onChange={v=>set('caresId',v)}/><Field label="Phone" value={edit.phone} onChange={v=>set('phone',v)}/><Field label="Language" value={edit.language} options={LISTS.Language||[]} onChange={v=>set('language',v)}/><Field label="Intake Date" type="date" value={edit.intakeDate} onChange={v=>set('intakeDate',v)}/><Field label="Adults" type="number" value={edit.adults} onChange={v=>set('adults',v)}/><Field label="Children" type="number" value={edit.children} onChange={v=>set('children',v)}/></div><hr/><div className="grid md:grid-cols-4 gap-4"><Field label="Housing Status" value={edit.housingStatus} options={LISTS.Housing_Status||[]} onChange={v=>set('housingStatus',v)}/><Field label="Voucher Type" value={edit.voucherType} options={LISTS.Voucher_Type||[]} onChange={v=>set('voucherType',v)}/><Field label="Voucher Status" value={edit.voucherStatus} options={LISTS.Voucher_Status||[]} onChange={v=>set('voucherStatus',v)}/><Field label="Bedroom Size" value={edit.bedroomSize} options={LISTS.Bedroom_Size||[]} onChange={v=>set('bedroomSize',v)}/><Field label="Voucher Amount" type="number" value={edit.voucherAmount} onChange={v=>set('voucherAmount',v)}/><Field label="Client Portion" type="number" value={edit.clientPortion} onChange={v=>set('clientPortion',v)}/><Field label="Voucher Expiration" type="date" value={edit.voucherExpDate} onChange={v=>set('voucherExpDate',v)}/><Field label="Public Assistance" value={edit.publicAssistance} options={LISTS.PA_Status||[]} onChange={v=>set('publicAssistance',v)}/></div><hr/><div className="grid md:grid-cols-4 gap-4"><Field label="AMA Program" value={edit.amaProgram} options={LISTS.AMA_Program||[]} onChange={v=>set('amaProgram',v)}/><Field label="AMA Status" value={edit.amaStatus} options={LISTS.AMA_Status||[]} onChange={v=>set('amaStatus',v)}/><Field label="Employment" value={edit.employmentStatus} options={LISTS.Employment_Status||[]} onChange={v=>set('employmentStatus',v)}/><Field label="Job Training" value={edit.jobTraining} options={LISTS.Job_Training||[]} onChange={v=>set('jobTraining',v)}/><Field label="Monthly Income" type="number" value={edit.monthlyIncome} onChange={v=>set('monthlyIncome',v)}/><Field label="Income Source" value={edit.incomeSource} options={LISTS.Income_Source||[]} onChange={v=>set('incomeSource',v)}/><Field label="Case Manager" value={edit.caseManager} onChange={v=>set('caseManager',v)}/><Field label="Last ILP / Case Note" type="date" value={edit.lastILP} onChange={v=>set('lastILP',v)}/><Field label="Last Inspection" type="date" value={edit.lastInspection} onChange={v=>set('lastInspection',v)}/></div><label className="block"><span className="text-xs font-bold uppercase text-slate-500">Case Notes</span><textarea value={edit.caseNotes||''} onChange={e=>set('caseNotes',e.target.value)} rows="5" className="mt-1 w-full border rounded-lg p-3"></textarea></label></div><div className="sticky bottom-0 bg-white border-t p-4 flex justify-end gap-3"><button onClick={()=>setEdit(null)} className="px-4 py-2 border rounded-lg font-semibold">Cancel</button><button onClick={save} className="px-5 py-2 bg-blue-700 text-white rounded-lg font-semibold">Save & Recalculate</button></div></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
